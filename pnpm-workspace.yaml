packages:
  - "packages/*"
  - "apps/*"

# Keep the optional Vitest DOM peer on a release old enough to satisfy the
# repository's minimum-release-age supply-chain policy.
overrides:
  happy-dom: 20.10.4

# esbuild ships a prebuilt platform binary through a postinstall script; Vite and
# Vitest cannot run without it. Every other dependency stays script-free.
allowBuilds:
  esbuild: true
