[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "adex-simulator"
version = "0.1.0"
description = "Offline synthetic environments and policy evaluation for ADEX. Never in the online request path."
readme = "README.md"
requires-python = "==3.13.14"
license = { text = "UNLICENSED" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[tool.hatch.build.targets.wheel]
packages = ["src/adex_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
